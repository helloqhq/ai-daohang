<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>NavXD · AI Tool Radar</title>
  <!-- 深海军底 -->
  <circle cx="16" cy="16" r="15" fill="#0a0b14"/>
  <!-- 靛蓝外圈 -->
  <circle cx="16" cy="16" r="14" stroke="#5b6cff" stroke-width="1.2" opacity=".75"/>
  <!-- 内圈淡线 -->
  <circle cx="16" cy="16" r="7" stroke="#ffffff" stroke-width=".5" opacity=".18"/>
  <!-- 十字准线 -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#ffffff" stroke-width=".3" opacity=".10"/>
  <line x1="3" y1="16" x2="29" y2="16" stroke="#ffffff" stroke-width=".3" opacity=".10"/>
  <!-- 扫描尾迹（旋转） -->
  <g style="transform-origin:16px 16px">
    <path d="M16 16 L16 2 A14 14 0 0 1 25.9 6.1 Z" fill="#00e5b0" opacity=".32">
      <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="5s" repeatCount="indefinite"/>
    </path>
    <line x1="16" y1="16" x2="25.9" y2="6.1" stroke="#00e5b0" stroke-width="1.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- 中心信号点 -->
  <circle cx="16" cy="16" r="2.4" fill="#00e5b0"/>
</svg>
